name: Deploy to EC2

on:
  push:
    branches:
      # 2026-05-22 수정: 현재 배포 서버가 origin/master를 기준으로 git pull 하므로 trigger branch를 master로 맞춤
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          SMTP_HOST_B64=$(printf '%s' "$SMTP_HOST" | base64 -w 0)
          SMTP_PORT_B64=$(printf '%s' "$SMTP_PORT" | base64 -w 0)
          SMTP_SECURE_B64=$(printf '%s' "$SMTP_SECURE" | base64 -w 0)
          SMTP_USER_B64=$(printf '%s' "$SMTP_USER" | base64 -w 0)
          SMTP_PASS_B64=$(printf '%s' "$SMTP_PASS" | base64 -w 0)
          MAIL_FROM_B64=$(printf '%s' "$MAIL_FROM" | base64 -w 0)
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "SMTP_HOST_B64='$SMTP_HOST_B64' SMTP_PORT_B64='$SMTP_PORT_B64' SMTP_SECURE_B64='$SMTP_SECURE_B64' SMTP_USER_B64='$SMTP_USER_B64' SMTP_PASS_B64='$SMTP_PASS_B64' MAIL_FROM_B64='$MAIL_FROM_B64' bash -s" << 'EOF'
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"
            git pull --ff-only
            upsert_env_from_b64() {
              python3 - "$1" "$2" <<'PY'
import base64
import pathlib
import sys

key = sys.argv[1]
value = base64.b64decode(sys.argv[2]).decode()
path = pathlib.Path(".env.production")
lines = path.read_text().splitlines() if path.exists() else []
updated = False
for index, line in enumerate(lines):
    if line.startswith(f"{key}="):
        lines[index] = f"{key}={value}"
        updated = True
        break
if not updated:
    lines.append(f"{key}={value}")
path.write_text("\\n".join(lines) + "\\n")
PY
            }
            upsert_env_from_b64 SMTP_HOST "$SMTP_HOST_B64"
            upsert_env_from_b64 SMTP_PORT "$SMTP_PORT_B64"
            upsert_env_from_b64 SMTP_SECURE "$SMTP_SECURE_B64"
            upsert_env_from_b64 SMTP_USER "$SMTP_USER_B64"
            upsert_env_from_b64 SMTP_PASS "$SMTP_PASS_B64"
            upsert_env_from_b64 MAIL_FROM "$MAIL_FROM_B64"
            # 2026-05-23 수정: 이전 orphan/container 이름 충돌을 막되 DB volume은 지우지 않도록 -v 없이 중지
            docker compose -f docker-compose.prod.yml --env-file .env.production down --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            # 2026-05-23 신규: production DB에 users 등 서비스 테이블이 없으면 배포 직후 migration으로 생성
            if ! docker compose -f docker-compose.prod.yml --env-file .env.production exec -T backend pnpm run migration:run:prod; then
              echo "Backend migration failed"
              docker compose -f docker-compose.prod.yml --env-file .env.production ps
              docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=120 backend
              exit 1
            fi

            echo "Waiting for frontend..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                echo "Frontend is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Frontend health check failed"
                # 2026-05-23 수정: 배포 실패 원인을 GitHub Actions 로그에서 바로 볼 수 있게 상태와 최근 로그를 출력
                docker compose -f docker-compose.prod.yml --env-file .env.production ps
                docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=80 frontend
                exit 1
              fi
              sleep 3
            done

            echo "Waiting for backend..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
                echo "Backend is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Backend health check failed"
                # 2026-05-23 수정: 배포 실패 원인을 GitHub Actions 로그에서 바로 볼 수 있게 상태와 최근 로그를 출력
                docker compose -f docker-compose.prod.yml --env-file .env.production ps
                docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=80 backend
                exit 1
              fi
              sleep 3
            done
          EOF
