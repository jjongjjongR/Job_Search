services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_job_search
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_job_search"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: ./ai
    environment:
      INTERNAL_SHARED_SECRET: local-internal-secret
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      REDIS_DEFAULT_TTL_SECONDS: 600
      REDIS_CLEANUP_WORKER_ENABLED: "true"
      REDIS_CLEANUP_INTERVAL_SECONDS: 30
      COVER_LETTER_RAG_DB_PATH: data/chroma_rag
      BACKEND_STORAGE_ROOT: /backend-storage
      STORAGE_PROVIDER: local
    ports:
      - "8000:8000"
    volumes:
      - backend-storage:/backend-storage
      - ai-rag-data:/app/data/chroma_rag
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      # 2026-05-18 신규: 로컬 compose는 운영 검증 모드가 아니라 시연/개발 모드로 실행
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: world_job_search
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: local-dev-secret-change-before-prod
      JWT_EXPIRES_IN: 1h
      AI_INTERNAL_BASE_URL: http://ai:8000
      AI_INTERNAL_SHARED_SECRET: local-internal-secret
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OPENAI_API_KEY: ""
      STORAGE_PROVIDER: local
      BACKEND_STORAGE_ROOT: /app/storage
    ports:
      - "3001:3001"
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-nextauth-secret-change-before-prod
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-storage:
  ai-rag-data:
