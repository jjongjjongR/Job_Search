# 2026-05-22 신규: 졸업작품 발표용 최소비용 EC2 단일 서버 배포 compose
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: ./ai
    restart: unless-stopped
    environment:
      INTERNAL_SHARED_SECRET: ${AI_INTERNAL_SHARED_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_JOB_ANALYSIS_MODEL: ${OPENAI_JOB_ANALYSIS_MODEL:-gpt-4o-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      REDIS_URL: redis://redis:6379/0
      REDIS_DEFAULT_TTL_SECONDS: ${REDIS_DEFAULT_TTL_SECONDS:-7200}
      REDIS_CLEANUP_WORKER_ENABLED: ${REDIS_CLEANUP_WORKER_ENABLED:-true}
      REDIS_CLEANUP_INTERVAL_SECONDS: ${REDIS_CLEANUP_INTERVAL_SECONDS:-30}
      COVER_LETTER_RAG_DB_PATH: /app/data/chroma_rag
      BACKEND_STORAGE_ROOT: /app/storage
      STORAGE_PROVIDER: local
    expose:
      - "8000"
    volumes:
      - backend-storage:/app/storage
      - ai-rag-data:/app/data/chroma_rag
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AI_INTERNAL_BASE_URL: http://ai:8000
      AI_INTERNAL_SHARED_SECRET: ${AI_INTERNAL_SHARED_SECRET}
      AI_INTERNAL_REQUEST_TIMEOUT_MS: ${AI_INTERNAL_REQUEST_TIMEOUT_MS:-30000}
      AI_COVER_LETTER_FEEDBACK_TIMEOUT_MS: ${AI_COVER_LETTER_FEEDBACK_TIMEOUT_MS:-180000}
      AI_INTERVIEW_ANSWER_TIMEOUT_MS: ${AI_INTERVIEW_ANSWER_TIMEOUT_MS:-180000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PROVIDER: local
      BACKEND_STORAGE_ROOT: /app/storage
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        # 2026-05-23 수정: NextAuth /api/auth와 충돌하지 않도록 EC2 배포용 backend 공개 prefix를 /backend로 고정
        NEXT_PUBLIC_API_BASE_URL: /backend
    restart: unless-stopped
    environment:
      # 2026-05-23 수정: EC2 .env.production에 과거 /api 값이 남아 있어도 frontend가 /backend를 사용하게 고정
      NEXT_PUBLIC_API_BASE_URL: /backend
      BACKEND_INTERNAL_API_BASE_URL: http://backend:3001
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  backend-storage:
  ai-rag-data:
